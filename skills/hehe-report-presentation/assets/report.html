<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}}</title>
<style>
:root{--ink:#173f58;--text:#273e4b;--muted:#607681;--blue:#2f6a85;--teal:#238b92;--pale:#edf4f6;--line:#cfdee4;--paper:#fff;--accent:#b48a50}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#dfe7eb;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--text);font-size:19px}a{color:var(--blue)}#stage{position:fixed;left:50%;top:calc(50% - 22px);width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}

.research-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:17px;line-height:1.55}.research-table th{text-align:left;background:var(--ink);color:white;font-size:17px;padding:11px 14px;font-weight:600}.research-table td{padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--line)}.research-table tr:nth-child(even) td{background:#f2f6f8}.research-table td:first-child{font-weight:600;color:var(--ink)}.research-table.tight td{padding:9px 12px}.research-table.tight th{padding:10px 12px}.research-table p{margin:0}.source-brief{margin-top:18px;padding:14px 20px;background:var(--pale);font-size:15px;line-height:1.65}.source-brief p{margin-bottom:8px}.source-brief a{font-size:12px}.scope-note,.note{margin-top:18px;font-size:15px;line-height:1.7;color:var(--muted)}.scope-note p{margin:0}.formula{padding:20px 26px;background:var(--ink);color:white;margin-bottom:20px;font-size:21px;text-align:center}.formula small{display:block;font-size:14px;margin-top:7px;color:#c2dce5}.timebar{display:flex;gap:3px;margin-top:22px}.timebar>div,.timebar>span{flex:1;padding:17px;background:var(--pale);font-size:16px;text-align:center}
.overview-grid{display:grid;grid-template-columns:1.06fr 1fr;gap:30px}.overview-grid .overview-intro{background:var(--ink);color:white;padding:26px;font-size:19px;line-height:1.78}.overview-grid h2{color:inherit}.overview-grid .overview-details{padding:0 2px}.overview-grid .overview-details p{font-size:18px;line-height:1.72}.overview-path{display:flex;align-items:center;gap:12px;margin-bottom:22px}.overview-path>div{flex:1;font-size:16px;line-height:1.5;color:var(--ink);text-align:center;position:relative;background:var(--pale);padding:14px 10px}.overview-path>div:not(:last-child):after{content:'›';position:absolute;right:-10px;top:20%;font-size:26px;color:var(--teal)}
.comparison{display:grid;grid-template-columns:1fr 1fr;gap:32px}.comparison .column-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}.column-head svg{width:42px;height:42px;color:var(--teal);flex-shrink:0}.column-head h2{margin:0}.comparison .comparison-col{padding:24px;background:var(--pale)}.comparison-col p{font-size:18px;line-height:1.73}.comparison .comparison-col:last-child{background:#f6f8f9}.mechanism-flow{display:flex;gap:0;margin:0 0 24px;counter-reset:step}.mechanism-flow>div{flex:1;display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:17px 18px;position:relative;border-right:2px solid #fff;font-size:16px;line-height:1.5}.mechanism-flow>div:before{counter-increment:step;content:counter(step,decimal-leading-zero);color:#89bdcc;font-size:24px}.mechanism-flow>div:last-child{background:var(--blue)}.section-label{font-size:13px;font-weight:600;letter-spacing:1px;color:var(--teal);margin-bottom:8px}
.scope-branches{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:0 0 22px}.scope-branches>div{padding:22px 23px 18px;background:var(--pale);position:relative}.scope-branches h2{display:flex;align-items:center;gap:12px;font-size:19px}.scope-branches svg{width:32px;height:32px;color:var(--blue)}.scope-branches p{font-size:18px;line-height:1.8}.scope-summary{display:grid;grid-template-columns:215px 1fr;gap:26px;padding:20px 24px;background:#e2eef2}.scope-summary h2{margin:0}.scope-summary p{font-size:18px;line-height:1.7}
.interview-list{display:flex;flex-direction:column;gap:0}.interview-row{display:grid;grid-template-columns:220px 105px 1fr;gap:18px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.65}.interview-row:last-child{border:0}.interview-row .name{font-weight:600;color:var(--ink);position:relative;padding:8px 10px 0 0}.interview-row .name:after{content:'';display:block;height:4px;width:var(--bar);margin-top:11px;background:var(--teal)}.interview-row .qty{white-space:nowrap;font-size:22px;font-weight:600;color:var(--ink);padding-top:4px}.interview-row .qty small{font-size:13px;font-weight:400;display:block}.interview-row.extra{color:var(--muted)}.interview-row.extra .name:after{background:var(--line)}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.role{background:var(--pale);padding:20px;min-height:156px}.role.role-lead{background:var(--ink);color:#fff}.role h2{display:flex;align-items:center;justify-content:space-between;font-size:19px;gap:12px}.role.role-lead h2{color:#fff}.role .days{font-size:14px;font-weight:400;white-space:nowrap}.role p{font-size:17px;line-height:1.7}.role.support{background:#f4f6f7}.team-note{font-size:16px;line-height:1.7;margin-top:20px}
.schedule{position:relative}.schedule:before{content:'';position:absolute;left:27px;top:20px;bottom:24px;width:2px;background:#a3bdc8}.week{display:grid;grid-template-columns:64px 1fr 1fr;gap:22px;position:relative;margin-bottom:11px;align-items:stretch}.week .week-mark{height:48px;width:56px;background:var(--blue);color:white;display:grid;place-items:center;font-size:19px;font-weight:600;margin-top:6px}.week .work,.week .output{padding:8px 16px;background:#f0f5f7;font-size:17px;line-height:1.65}.week .output{background:#e4eff1}.week.last .week-mark{background:var(--teal)}.schedule-labels{display:grid;grid-template-columns:64px 1fr 1fr;gap:22px;font-size:14px;color:var(--muted);padding:0 0 10px}.schedule-labels span:not(:first-child){padding-left:16px}
.cover,.chapter,.back{background:var(--ink);color:white}.cover h1,.chapter h1,.back h1{color:white}.cover .eyebrow,.chapter .eyebrow,.back .eyebrow{color:#9ebfcc}.cover .lead,.chapter .lead,.back .lead{color:#cfdee4}.cover footer,.chapter footer,.back footer{color:#a2becb}.cover header{position:relative;z-index:2;width:900px;margin-top:48px}.cover h1{font-size:45px;line-height:1.5;margin:54px 0 24px;white-space:pre-line;max-width:850px}.cover .lead{font-size:22px;line-height:1.8;max-width:820px}.cover .content{position:static;z-index:2;margin-top:48px;font-size:16px;color:#cadbe3}.cover-art{position:absolute;right:-110px;top:50px;width:650px;height:650px;opacity:.19;pointer-events:none}.cover-art svg{width:100%;height:100%}.cover-meta{display:flex;gap:26px;flex-wrap:wrap}.cover-note{margin-top:16px;font-size:15px}.cover-rule{width:70px;height:4px;background:#6cbdbe;margin:20px 0}.chapter header,.back header{position:relative;z-index:2;margin:135px 0 0 300px}.chapter h1,.back h1{font-size:36px;max-width:800px;margin:20px 0 25px}.chapter .lead,.back .lead{max-width:780px;line-height:1.8;font-size:21px}.chapter .content,.back .content{position:relative;z-index:2;margin:36px 0 0 300px}.chapter-mark{position:absolute;left:-305px;top:-202px;font-size:135px;line-height:1;color:#36718d;letter-spacing:-8px}.chapter-route{display:flex;gap:24px}.chapter-route>span{flex:1;font-size:17px;line-height:1.7;border-top:1px solid #52788c;padding-top:15px;color:#d7e5eb}.chapter:before,.back:before{content:'';position:absolute;top:0;left:0;width:262px;height:100%;background:#123447}.back header{margin-left:180px}.back .content{margin-left:180px}.back:before{width:90px}.toc .content{margin-top:44px}.toc-link{display:grid;grid-template-columns:44px 1fr 40px;gap:14px;align-items:center;padding:22px 18px;text-decoration:none;border-bottom:1px solid var(--line);background:#f2f6f8;color:var(--ink);min-height:100px}.toc-link b{font-size:30px;color:var(--teal);font-weight:400}.toc-link strong{font-size:20px}.toc-link em{font-size:13px;font-style:normal;color:var(--muted);text-align:right}.toc-link:hover{background:#deecef}
#toolbar{position:fixed;bottom:0;left:0;right:0;height:44px;background:#132f40;display:flex;align-items:center;justify-content:center;gap:16px;color:white;font-size:13px;z-index:10}button,select,#download{background:transparent;border:1px solid #597582;color:#e7f0f5;border-radius:3px;padding:5px 12px;font:inherit;cursor:pointer;text-decoration:none}select{max-width:480px;background:#132f40}button:hover,#download:hover{background:#2d5367}#counter{min-width:58px;text-align:center}button:disabled{opacity:.3;cursor:default}
@media print{@page{size:338.6667mm 190.5mm;margin:0}html,body{height:auto;overflow:visible;background:white;print-color-adjust:exact;-webkit-print-color-adjust:exact}#toolbar{display:none}#stage{position:static;transform:none;width:1280px;height:auto}.slide{position:relative;visibility:visible!important;pointer-events:auto;width:1280px;height:720px;break-after:page;page-break-after:always}.slide:last-child{break-after:auto;page-break-after:auto}}
.technical-evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:16px 0 22px}.technical-evidence>div{padding:18px 20px;background:var(--pale)}.technical-evidence p{font-size:17.5px;line-height:1.72}.operating-review{display:grid;grid-template-columns:225px 1fr;gap:28px;padding-top:20px;border-top:1px solid var(--line)}.operating-review p{font-size:17.5px;line-height:1.7;margin-bottom:12px}.model-group{display:grid;grid-template-columns:225px 1fr;gap:28px;margin-bottom:24px}.model-group-heading{background:var(--ink);color:white;padding:22px;display:flex;align-items:center}.model-group h2{font-size:21px;color:inherit;margin:0;line-height:1.65}.model-step{display:grid;grid-template-columns:36px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.model-step:first-child{padding-top:0}.model-step:last-child{border-bottom:0;padding-bottom:0}.model-step span{color:var(--teal);font-size:23px;line-height:1.6}.model-step p{font-size:18px;line-height:1.7;margin:0}.model-group:last-child .model-group-heading{background:var(--blue)}
{{EXTRA_CSS}}
</style></head><body data-canvas="{{CANVAS}}" data-theme="{{THEME}}"><main id="stage">{{SLIDES}}</main><nav id="toolbar"><button id="prev" aria-label="上一页">←</button><span id="counter"></span><button id="next" aria-label="下一页">→</button><select id="pages" aria-label="选择页面">{{OPTIONS}}</select><button id="contents">目录</button><button id="fullscreen">全屏</button><a id="download" href="{{PDF}}" download>下载 PDF</a></nav>
<script>
const slides=[...document.querySelectorAll('.slide')],sel=document.querySelector('#pages');const scrollMode=document.body.dataset.canvas==='scroll';let current=0;
function show(n){current=Math.max(0,Math.min(slides.length-1,Number(n)));slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',String(!scrollMode&&i!==current))});if(scrollMode)slides[current].scrollIntoView({behavior:'instant'});sel.value=current;document.querySelector('#counter').textContent=`${current+1} / ${slides.length}`;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;history.replaceState(null,'','#page-'+(current+1))}
function scale(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/{{WIDTH}},(innerHeight-44)/{{HEIGHT}}))}document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);sel.onchange=()=>show(sel.value);document.querySelector('#contents').onclick=()=>show(Math.max(0,slides.findIndex(s=>s.classList.contains('toc'))));document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.target.matches('select,input,textarea'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});window.addEventListener('resize',scale);scale();show(Number((location.hash.match(/page-(\d+)/)||[])[1]||1)-1);document.fonts.ready.then(()=>document.documentElement.dataset.ready='true');
</script></body></html>
